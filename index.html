<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean the Ocean</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
    <div id="ui">
        <h1>Clean the Ocean!</h1>
        <p>Click the trash before the fish eat it.</p>
        <div id="scoreBoard">
            <span class="score-item">Trash Removed: <span id="trashScore">0</span></span>
            <span class="score-item">Fish Died: <span id="fishDeathScore">0</span>/5</span>
            <span class="score-item highlight">High Score: <span id="highScore">0</span></span>
        </div>
    </div>
    <div id="gameOver" class="hidden">
        <h2 id="gameOverTitle">Game Over!</h2>
        <p id="gameOverMessage"></p>
        <button id="restartBtn">Play Again</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
